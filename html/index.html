<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Frantic Youtube Player</title>
	<style>
		html, body {
			margin: 0;
			background: transparent !important;
			overflow: hidden;
		}

		/* Players are audio only; keep them off screen. */
		#players {
			position: absolute;
			left: -10000px;
			top: -10000px;
			width: 0;
			height: 0;
			overflow: hidden;
			pointer-events: none;
		}
	</style>
</head>
<body>
	<div id="players"></div>

	<!-- main.js defines onYouTubeIframeAPIReady, so it must load before the API does. -->
	<script src="./js/main.js"></script>
	<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
